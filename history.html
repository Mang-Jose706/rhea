<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDEease Portal - History</title>

<link rel="stylesheet" href="style.css">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- ---------------- SIDEBAR ---------------- -->
<div class="sidebar">
    <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <h2>IDEease Portal</h2>
        <p>Student Services</p>
    </div>

    <div class="menu">
        <a href="student-dashboard.html" class="menu-item">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>
        <div class="menu-item active">
            <i class="fa-solid fa-clock-rotate-left"></i>
            History
        </div>

        <a href="help center.html" class="menu-item">
            <i class="fa-solid fa-headset"></i>
            Help & Support
        </a>

        <a href="profile.html" class="menu-item">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>

        <a href="setting.html" class="menu-item">
            <i class="fa-solid fa-gear"></i>
            Settings
        </a>
    </div>
</div>
<!-- ---------------- CONTENT ---------------- -->
<div class="content">
    
    <div class="header">
        <div>
            <h1>History</h1>
            <span>Explore the history for school ID request.</span>
        </div>
        <a href="notif.html"><i class="fa-regular fa-bell"></i></a>
    </div>

    <!-- Statistics Section -->
    <div class="stats">
        <div class="stat-card stat-inline">
            <i class="fa-solid fa-list-check"></i>
            <div class="stat-text">
                <h3>Total Requests:</h3>
                <p id="totalCount">0</p>
            </div>
        </div>

        <div class="stat-card stat-inline">
            <i class="fa-solid fa-clock" style="color: #f59e0b;"></i>
            <div class="stat-text">
                <h3>Pending:</h3>
                <p id="pendingCount">0</p>
            </div>
        </div>

        <div class="stat-card stat-inline">
            <i class="fa-solid fa-spinner" style="color: #3b82f6;"></i>
            <div class="stat-text">
                <h3>Processing:</h3>
                <p id="processingCount">0</p>
            </div>
        </div>

        <div class="stat-card stat-inline">
            <i class="fa-solid fa-circle-check" style="color: #10b981;"></i>
            <div class="stat-text">
                <h3>Completed:</h3>
                <p id="completedCount">0</p>
            </div>
        </div>

        <div class="stat-card stat-inline">
            <i class="fa-solid fa-circle-xmark" style="color: #ef4444;"></i>
            <div class="stat-text">
                <h3>Rejected:</h3>
                <p id="rejectedCount">0</p>
            </div>
        </div>
    </div>

    <!-- Updated Search Row -->
<div class="search-row">
    <input type="text" id="searchInput" placeholder="Search by Request ID or Type...">
    <select id="statusFilter">
        <option value="">All Status</option>
        <option value="submitted">Submitted</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="verification">Verification</option>
        <option value="completed">Completed</option>
        <option value="rejected">Rejected</option>
    </select>
</div>

<!-- Table with Dynamic Data -->
<div class="table-card">
    <table id="requestsTable">
        <thead>
            <tr>
                <th>Request ID</th>
                <th>Request Type</th>
                <th>Date Submitted</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dynamic rows will be inserted here -->
        </tbody>
    </table>
    <div id="noDataMessage" style="text-align: center; padding: 40px; color: #666;">
        <i class="fa-solid fa-inbox" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
        <p style="font-size: 16px;">No requests found</p>
    </div>
</div>

<script>
    // Role-based access control
    function getCurrentUser() {
        try {
            const user = JSON.parse(localStorage.getItem('user')) || {};
            return user;
        } catch (e) {
            return {};
        }
    }

    function isAdmin() {
        const user = getCurrentUser();
        return user.role === 'admin' || user.accountType === 'admin';
    }

    function getCurrentStudentId() {
        const user = getCurrentUser();
        return user.studentId || null;
    }

    // Request database: stores all requests with student associations
    function getAllRequests() {
        try {
            const stored = localStorage.getItem('requests');
            return stored ? JSON.parse(stored) : getDefaultRequests();
        } catch (e) {
            return getDefaultRequests();
        }
    }

    // Default sample requests with student IDs
    function getDefaultRequests() {
        return [
            { id: 'ID-123456', type: 'New Student ID', date: 'Dec 15, 2024', status: 'processing', studentId: '123456' },
            { id: 'ID-654321', type: 'ID Replacement', date: 'Dec 16, 2025', status: 'completed', studentId: '654321' },
            { id: 'ID-234165', type: 'New Student ID', date: 'Dec 15, 2025', status: 'pending', studentId: '234165' },
            { id: 'ID-987654', type: 'ID Replacement', date: 'Dec 17, 2025', status: 'rejected', studentId: '987654' }
        ];
    }

    // Filter requests based on role
    function getVisibleRequests() {
        const allRequests = getAllRequests();
        const admin = isAdmin();
        const currentStudentId = getCurrentStudentId();

        if (admin) {
            return allRequests; // admins see all
        } else {
            return allRequests.filter(req => req.studentId === currentStudentId);
        }
    }

    const statusSelect = document.getElementById('statusFilter');
    const tableRows = document.querySelectorAll('.table-card table tr');
    const searchInput = document.querySelector('.search-row input');
    const user = getCurrentUser();
    const adminMode = isAdmin();

    // Show admin indicator if user is admin
    if (adminMode) {
        const header = document.querySelector('.table-header');
        if (header) {
            const adminBadge = document.createElement('div');
            adminBadge.style.cssText = 'display:inline-block;background:#3b82f6;color:white;padding:6px 12px;border-radius:6px;margin-left:12px;font-size:12px;font-weight:600';
            adminBadge.textContent = 'ADMIN VIEW: All Requests';
            header.parentNode.insertBefore(adminBadge, header.nextSibling);
        }
    }

    function filterTable() {
        const selectedStatus = statusSelect.value.toLowerCase();
        const searchText = searchInput.value.toLowerCase();
        const visibleRequests = getVisibleRequests();
        const visibleIds = new Set(visibleRequests.map(r => r.id));

        tableRows.forEach((row, index) => {
            if(index === 0) return; // skip header row

            const requestId = row.querySelector('td:nth-child(1)')?.textContent?.trim();
            const statusSpan = row.querySelector('td:nth-child(4) span');
            const rowStatus = statusSpan?.getAttribute('data-status')?.toLowerCase() || '';
            const rowText = row.innerText.toLowerCase();

            // Check if this request is visible to the current user
            const isAccessible = adminMode || visibleIds.has(requestId);
            const statusMatch = selectedStatus === 'all' || rowStatus === selectedStatus;
            const searchMatch = rowText.includes(searchText);

            row.style.display = (isAccessible && statusMatch && searchMatch) ? '' : 'none';
        });
    }

    statusSelect.addEventListener('change', filterTable);
    searchInput.addEventListener('input', filterTable);

    document.addEventListener('DOMContentLoaded', () => {
        const rows = document.querySelectorAll('tr[data-id]');
        rows.forEach(row => {
            const id = row.getAttribute('data-id');
            const status = localStorage.getItem(id + '_status');
            if (status === 'rejected') {
                row.remove();
            }
        });
    });

    // Initialize dark mode if enabled in localStorage
    window.addEventListener('DOMContentLoaded', () => {
        try {
            const darkModeEnabled = localStorage.getItem('pref-darkMode') === '1';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
            }
        } catch(e) {}
    });
</script>


</div>

</body>
</html>
