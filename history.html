<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>IDEease Portal - History</title>

<link rel="stylesheet" href="style.css">

<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>

<!-- ---------------- SIDEBAR ---------------- -->
<div class="sidebar">
    <div class="logo">
        <i class="fa-solid fa-graduation-cap"></i>
        <h2>IDEease Portal</h2>
        <p>Student Services</p>
    </div>

    <div class="menu">
        <a href="student-dashboard.html" class="menu-item">
            <i class="fa-solid fa-house"></i>
            Dashboard
        </a>
        <div class="menu-item active">
            <i class="fa-solid fa-clock-rotate-left"></i>
            History
        </div>

        <a href="help center.html" class="menu-item">
            <i class="fa-solid fa-headset"></i>
            Help & Support
        </a>

        <a href="profile.html" class="menu-item">
            <i class="fa-solid fa-user"></i>
            Profile
        </a>

        <a href="setting.html" class="menu-item">
            <i class="fa-solid fa-gear"></i>
            Settings
        </a>
    </div>
</div>
<!-- ---------------- CONTENT ---------------- -->
<div class="content">
    
    <div class="header">
        <div>
            <h1>History</h1>
            <span>Explore the history for school ID request.</span>
        </div>
        <a href="notif.html"><i class="fa-regular fa-bell"></i></a>
    </div>

    <!-- Statistics Section -->
    <div class="stats">
        <div class="stat-card stat-inline">
            <i class="fa-solid fa-list-check"></i>
            <div class="stat-text">
                <h3>Total Requests:</h3>
                <p id="totalCount">0</p>
            </div>
        </div>

        <div class="stat-card stat-inline">
            <i class="fa-solid fa-clock" style="color: #f59e0b;"></i>
            <div class="stat-text">
                <h3>Pending:</h3>
                <p id="pendingCount">0</p>
            </div>
        </div>

        <div class="stat-card stat-inline">
            <i class="fa-solid fa-spinner" style="color: #3b82f6;"></i>
            <div class="stat-text">
                <h3>Processing:</h3>
                <p id="processingCount">0</p>
            </div>
        </div>

        <div class="stat-card stat-inline">
            <i class="fa-solid fa-circle-check" style="color: #10b981;"></i>
            <div class="stat-text">
                <h3>Completed:</h3>
                <p id="completedCount">0</p>
            </div>
        </div>

        <div class="stat-card stat-inline">
            <i class="fa-solid fa-circle-xmark" style="color: #ef4444;"></i>
            <div class="stat-text">
                <h3>Rejected:</h3>
                <p id="rejectedCount">0</p>
            </div>
        </div>
    </div>

    <!-- Updated Search Row -->
<div class="search-row">
    <input type="text" id="searchInput" placeholder="Search by Request ID or Type...">
    <select id="statusFilter">
        <option value="">All Status</option>
        <option value="submitted">Submitted</option>
        <option value="pending">Pending</option>
        <option value="processing">Processing</option>
        <option value="verification">Verification</option>
        <option value="completed">Completed</option>
        <option value="rejected">Rejected</option>
    </select>
</div>

<!-- Table with Dynamic Data -->
<div class="table-card">
    <table id="requestsTable">
        <thead>
            <tr>
                <th>Request ID</th>
                <th>Request Type</th>
                <th>Date Submitted</th>
                <th>Status</th>
            </tr>
        </thead>
        <tbody id="tableBody">
            <!-- Dynamic rows will be inserted here -->
        </tbody>
    </table>
    <div id="noDataMessage" style="text-align: center; padding: 40px; color: #666;">
        <i class="fa-solid fa-inbox" style="font-size: 48px; margin-bottom: 16px; opacity: 0.5;"></i>
        <p style="font-size: 16px;">No requests found</p>
    </div>
</div>

<script>
    // ============ AUTHENTICATION & AUTHORIZATION ============
    
    /**
     * Get current logged-in user from localStorage
     */
    function getCurrentUser() {
        try {
            const user = JSON.parse(localStorage.getItem('user')) || {};
            return user;
        } catch (e) {
            console.warn('Failed to parse user from localStorage', e);
            return {};
        }
    }

    /**
     * Check if current user is admin
     */
    function isAdmin() {
        const user = getCurrentUser();
        return user.role === 'admin' || user.accountType === 'admin' || user.role === 'superadmin';
    }

    /**
     * Get current student ID (only for non-admin users)
     */
    function getCurrentStudentId() {
        const user = getCurrentUser();
        return user.studentId || user.id || null;
    }

    /**
     * Check if user is authenticated
     */
    function isAuthenticated() {
        const user = getCurrentUser();
        return user && (user.studentId || user.id || user.role);
    }

    // Redirect to login if not authenticated
    if (!isAuthenticated()) {
        window.location.href = 'login.html';
    }

    // ============ DATA RETRIEVAL ============

    /**
     * Get all requests from localStorage
     */
    function getAllRequests() {
        try {
            const stored = localStorage.getItem('requests');
            return stored ? JSON.parse(stored) : [];
        } catch (e) {
            console.warn('Failed to parse requests from localStorage', e);
            return [];
        }
    }

    // Hidden requests that should not be displayed
    const HIDDEN_REQUEST_IDS = new Set(['REQ-1780024153165']);

    /**
     * Get requests visible to current user (role-based filtering)
     * - Admins see all requests
     * - Students see only their own requests
     */
    function getVisibleRequests() {
        const allRequests = getAllRequests();
        const currentUser = getCurrentUser();
        const adminMode = isAdmin();
        const studentId = getCurrentStudentId();

        if (adminMode) {
            // Admins see everything except hidden requests
            return allRequests.filter(req => !HIDDEN_REQUEST_IDS.has(req.id || req.request_id));
        } else if (studentId) {
            // Students see only their own requests, excluding hidden ones
            return allRequests.filter(req => {
                if (HIDDEN_REQUEST_IDS.has(req.id || req.request_id)) {
                    return false; // Exclude hidden requests
                }
                const reqStudentId = req.studentId || req.student_id || '';
                return reqStudentId === studentId || reqStudentId === String(studentId);
            });
        }
        return [];
    }

    /**
     * Get status icon based on request status
     */
    function getStatusIcon(status) {
        const statusLower = (status || '').toLowerCase();
        switch (statusLower) {
            case 'submitted':
                return '<i class="fa-solid fa-paper-plane"></i>';
            case 'pending':
                return '<i class="fa-solid fa-clock"></i>';
            case 'processing':
                return '<i class="fa-solid fa-spinner"></i>';
            case 'verification':
                return '<i class="fa-solid fa-magnifying-glass"></i>';
            case 'completed':
                return '<i class="fa-solid fa-circle-check"></i>';
            case 'rejected':
                return '<i class="fa-solid fa-circle-xmark"></i>';
            default:
                return '<i class="fa-solid fa-circle"></i>';
        }
    }

    /**
     * Get CSS class for status badge styling
     */
    function getStatusClass(status) {
        const statusLower = (status || '').toLowerCase();
        switch (statusLower) {
            case 'submitted':
            case 'pending':
                return 'status-pending';
            case 'processing':
            case 'verification':
                return 'status-processing';
            case 'completed':
                return 'status-completed';
            case 'rejected':
                return 'status-rejected';
            default:
                return 'status-pending';
        }
    }

    /**
     * Format date to readable format
     */
    function formatDate(dateString) {
        if (!dateString) return '-';
        try {
            const date = new Date(dateString);
            return date.toLocaleDateString('en-US', { 
                year: 'numeric', 
                month: 'short', 
                day: 'numeric' 
            });
        } catch (e) {
            return dateString;
        }
    }

    // ============ TABLE POPULATION ============

    /**
     * Populate the requests table with filtered data
     */
    function populateTable() {
        const tableBody = document.getElementById('tableBody');
        const noDataMessage = document.getElementById('noDataMessage');
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');
        
        const visibleRequests = getVisibleRequests();
        const searchText = (searchInput.value || '').toLowerCase();
        const selectedStatus = (statusFilter.value || '').toLowerCase();

        // Filter requests based on search and status filter
        const filteredRequests = visibleRequests.filter(req => {
            const requestId = (req.id || req.request_id || '').toLowerCase();
            const requestType = (req.type || '').toLowerCase();
            const status = (req.status || '').toLowerCase();
            
            const matchesSearch = !searchText || requestId.includes(searchText) || requestType.includes(searchText);
            const matchesStatus = !selectedStatus || status === selectedStatus;
            
            return matchesSearch && matchesStatus;
        });

        // Clear existing rows
        tableBody.innerHTML = '';

        // Show or hide no data message
        if (filteredRequests.length === 0) {
            noDataMessage.style.display = 'block';
            return;
        } else {
            noDataMessage.style.display = 'none';
        }

        // Populate table rows
        filteredRequests.forEach(req => {
            const row = document.createElement('tr');
            const requestId = req.id || req.request_id || '-';
            const requestType = req.type || '-';
            const dateSubmitted = formatDate(req.createdAt || req.date);
            const status = req.status || 'pending';
            const statusIcon = getStatusIcon(status);
            const statusClass = getStatusClass(status);

            row.innerHTML = `
                <td><strong>${requestId}</strong></td>
                <td>${requestType}</td>
                <td>${dateSubmitted}</td>
                <td>
                    <span class="status-badge ${statusClass}">
                        ${statusIcon} ${status.charAt(0).toUpperCase() + status.slice(1)}
                    </span>
                </td>
            `;

            tableBody.appendChild(row);
        });
    }

    // ============ COUNTER UPDATES ============

    /**
     * Update all status counters
     */
    function updateCounters() {
        const visibleRequests = getVisibleRequests();

        const counts = {
            total: visibleRequests.length,
            pending: visibleRequests.filter(r => {
                const status = (r.status || '').toLowerCase();
                return status === 'submitted' || status === 'pending';
            }).length,
            processing: visibleRequests.filter(r => {
                const status = (r.status || '').toLowerCase();
                return status === 'processing' || status === 'verification';
            }).length,
            completed: visibleRequests.filter(r => 
                (r.status || '').toLowerCase() === 'completed'
            ).length,
            rejected: visibleRequests.filter(r => 
                (r.status || '').toLowerCase() === 'rejected'
            ).length
        };

        // Update DOM
        document.getElementById('totalCount').textContent = counts.total;
        document.getElementById('pendingCount').textContent = counts.pending;
        document.getElementById('processingCount').textContent = counts.processing;
        document.getElementById('completedCount').textContent = counts.completed;
        document.getElementById('rejectedCount').textContent = counts.rejected;
    }

    // ============ EVENT LISTENERS ============

    /**
     * Initialize event listeners for search and filter
     */
    function initializeEventListeners() {
        const searchInput = document.getElementById('searchInput');
        const statusFilter = document.getElementById('statusFilter');

        if (searchInput) {
            searchInput.addEventListener('input', populateTable);
        }

        if (statusFilter) {
            statusFilter.addEventListener('change', populateTable);
        }
    }

    // ============ INITIALIZATION ============

    /**
     * Initialize page on load
     */
    document.addEventListener('DOMContentLoaded', () => {
        try {
            // Verify authentication
            if (!isAuthenticated()) {
                window.location.href = 'login.html';
                return;
            }

            // Show admin indicator if applicable
            const currentUser = getCurrentUser();
            if (isAdmin()) {
                const header = document.querySelector('.header');
                if (header) {
                    const adminBadge = document.createElement('div');
                    adminBadge.style.cssText = `
                        display: inline-block;
                        background: #3b82f6;
                        color: white;
                        padding: 6px 12px;
                        border-radius: 6px;
                        margin-left: 12px;
                        font-size: 12px;
                        font-weight: 600;
                    `;
                    adminBadge.textContent = 'ADMIN VIEW: All Requests';
                    header.appendChild(adminBadge);
                }
            }

            // Initialize page
            initializeEventListeners();
            updateCounters();
            populateTable();

            // Set up real-time sync if needed (listen for localStorage changes)
            window.addEventListener('storage', () => {
                updateCounters();
                populateTable();
            });

        } catch (e) {
            console.error('Failed to initialize history page', e);
        }
    });

    // Initialize dark mode if enabled
    window.addEventListener('load', () => {
        try {
            const darkModeEnabled = localStorage.getItem('pref-darkMode') === '1';
            if (darkModeEnabled) {
                document.body.classList.add('dark-mode');
            }
        } catch (e) {}
    });
</script>


</div>

</body>
</html>
