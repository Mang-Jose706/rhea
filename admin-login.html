<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Portal - Login</title>
    <style>
        :root {
            --primary-color: #3498db;
            --success-color: #27ae60;
            --danger-color: #e74c3c;
            --warning-color: #f39c12;
            --background: #eef4ff;
            --surface: #ffffff;
            --surface-alt: #f5f8ff;
            --text-primary: #111827;
            --text-secondary: #6b7280;
            --border: #d1d5db;
            --shadow: 0 24px 70px rgba(15, 23, 42, 0.12);
        }

        body {
            margin: 0;
            font-family: "Poppins", sans-serif;
            background: linear-gradient(135deg, #eef4ff 0%, #d7e7ff 100%);
            min-height: 100vh;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        body.dark-mode {
            background: linear-gradient(135deg, #11121a 0%, #1f2433 100%);
            color: #eceff4;
            --surface: #1f2230;
            --surface-alt: #272b39;
            --text-primary: #eceff4;
            --text-secondary: #a8b0c2;
            --border: #3b3f51;
            --shadow: 0 24px 70px rgba(0, 0, 0, 0.45);
        }

        * {
            box-sizing: border-box;
        }

        .admin-container {
            width: min(540px, 100%);
            background: var(--surface);
            box-shadow: var(--shadow);
            border-radius: 28px;
            padding: 36px 34px;
            position: relative;
        }

        .admin-header {
            margin-bottom: 24px;
            text-align: center;
        }

        .admin-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--danger-color);
            margin: 0 auto;
            color: white;
            padding: 8px 16px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            margin-bottom: 16px;
        }

        .admin-header h1 {
            font-size: 32px;
            margin-bottom: 10px;
            line-height: 1.1;
        }

        .admin-header p {
            font-size: 15px;
            color: var(--text-secondary);
            margin: 0;
        }

        .security-notice {
            display: flex;
            gap: 14px;
            align-items: flex-start;
            background: #fef2f2;
            border: 1px solid #fecaca;
            border-radius: 18px;
            padding: 18px 20px;
            margin-bottom: 26px;
            color: #7f1d1d;
            font-size: 14px;
        }

        body.dark-mode .security-notice {
            background: rgba(248, 113, 113, 0.12);
            border-color: rgba(248, 113, 113, 0.35);
            color: #f5c6cb;
        }

        .security-notice i {
            font-size: 18px;
            margin-top: 2px;
        }

        .offline-banner {
            display: none;
            gap: 12px;
            align-items: flex-start;
            background: #fff7dd;
            border: 1px solid #f5c06e;
            border-radius: 18px;
            padding: 16px 18px;
            margin-bottom: 22px;
            color: #664d03;
            font-size: 14px;
        }

        .offline-banner i {
            margin-top: 2px;
            color: #d97706;
        }

        body.dark-mode .offline-banner {
            background: rgba(245, 158, 11, 0.12);
            border-color: rgba(245, 158, 11, 0.35);
            color: #f6d186;
        }

        .offline-banner.hidden {
            display: none;
        }

        .input-group {
            margin-bottom: 18px;
            text-align: left;
        }

        .input-group label {
            display: block;
            margin-bottom: 8px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            color: var(--text-secondary);
        }

        .input-group input,
        .input-group select {
            width: 100%;
            padding: 14px 16px;
            border-radius: 16px;
            border: 1px solid var(--border);
            background: var(--surface-alt);
            color: var(--text-primary);
            font-size: 15px;
            outline: none;
            transition: border-color 0.25s ease, box-shadow 0.25s ease;
        }

        body.dark-mode .input-group input,
        body.dark-mode .input-group select {
            background: #232635;
            border-color: #3b3f51;
            color: var(--text-primary);
        }

        .input-group input:focus,
        .input-group select:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(52, 152, 219, 0.12);
        }

        .password-toggle {
            position: relative;
        }

        .password-toggle input {
            padding-right: 52px;
        }

        .password-toggle .toggle-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 6px;
            font-size: 16px;
        }

        .login-btn {
            width: 100%;
            padding: 16px 18px;
            border-radius: 16px;
            border: none;
            background: var(--primary-color);
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s ease, box-shadow 0.2s ease, background-color 0.2s ease;
            margin-top: 8px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            background: #2c81d3;
            box-shadow: 0 18px 36px rgba(52, 152, 219, 0.18);
        }

        .login-btn:disabled {
            background: #a3c4f5;
            cursor: not-allowed;
            transform: none;
        }

        .success-message,
        .error-message {
            display: none;
            align-items: center;
            gap: 10px;
            border-radius: 16px;
            padding: 14px 16px;
            font-size: 14px;
            margin-bottom: 18px;
        }

        .success-message {
            background: #d1fae5;
            border: 1px solid #34d399;
            color: #065f46;
        }

        body.dark-mode .success-message {
            background: rgba(16, 185, 129, 0.16);
            border-color: rgba(16, 185, 129, 0.45);
            color: #d1fae5;
        }

        .error-message {
            background: #fee2e2;
            border: 1px solid #fca5a5;
            color: #991b1b;
        }

        body.dark-mode .error-message {
            background: rgba(248, 113, 113, 0.18);
            border-color: rgba(248, 113, 113, 0.42);
            color: #fca5a5;
        }

        .success-message.show,
        .error-message.show {
            display: flex;
        }

        .footer-links {
            margin-top: 24px;
            font-size: 14px;
            color: var(--text-secondary);
            text-align: center;
        }

        .footer-links a {
            color: var(--primary-color);
            font-weight: 700;
            text-decoration: none;
        }

        .footer-links a:hover {
            text-decoration: underline;
        }

        .dark-mode-toggle {
            position: fixed;
            top: 22px;
            right: 22px;
            width: 46px;
            height: 46px;
            border-radius: 50%;
            border: none;
            background: var(--surface);
            color: var(--text-primary);
            box-shadow: 0 12px 28px rgba(15, 23, 42, 0.12);
            cursor: pointer;
            font-size: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
            z-index: 20;
        }

        body.dark-mode .dark-mode-toggle {
            background: #2c2f3c;
            color: #f8fafc;
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.32);
        }

        .dark-mode-toggle:hover {
            transform: scale(1.05);
        }

        @media (max-width: 560px) {
            .admin-container {
                padding: 28px 20px;
            }

            .admin-header h1 {
                font-size: 26px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <button class="dark-mode-toggle" onclick="toggleTheme()" title="Toggle Dark Mode">🌙</button>
    <div class="admin-container">
        <div class="admin-header">
            <div class="admin-badge">
                <i class="fa-solid fa-shield"></i> Admin Portal
            </div>
            <h1>Administrator Login</h1>
            <p>Secure access to admin dashboard</p>
        </div>

        <div class="offline-banner hidden" id="localModeBanner">
            <i class="fa-solid fa-wifi-slash"></i>
            <div><strong>Local sign in available:</strong> Admin credentials are stored locally and can log in if the backend is unavailable.</div>
        </div>

        <div class="security-notice">
            <i class="fa-solid fa-lock"></i>
            <span>This is a restricted admin area. Unauthorized access is monitored.</span>
        </div>

        <div class="success-message" id="successMessage">
            <i class="fa-solid fa-circle-check"></i>
            <span id="successText"></span>
        </div>
        <div class="error-message" id="errorMessage">
            <i class="fa-solid fa-exclamation-circle"></i>
            <span id="errorText"></span>
        </div>

        <form id="adminLoginForm" autocomplete="off" onsubmit="adminLogin(event)">
            <div class="input-group">
                <label for="adminId">Admin Username</label>
                <input type="text" id="adminId" autocomplete="off" placeholder="Enter admin username" required>
            </div>

            <div class="input-group">
                <label for="adminPassword">Password</label>
                <div class="password-toggle">
                    <input type="password" id="adminPassword" autocomplete="new-password" placeholder="Enter password" required>
                    <button type="button" class="toggle-btn" onclick="togglePasswordVisibility(event)">
                        <i class="fa-solid fa-eye"></i>
                    </button>
                </div>
            </div>

            <div class="input-group">
                <label for="adminKey">
                    <i class="fa-solid fa-key"></i> Admin Secret Code
                </label>
                <input type="password" id="adminKey" placeholder="Enter admin secret code" required>
            </div>

            <button type="submit" class="login-btn">
                <i class="fa-solid fa-sign-in-alt"></i> Access Admin Dashboard
            </button>
            <div class="footer-links">
                <p>New admin? <a href="admin-signup.html">Register here</a></p>
            </div>
        </form>

    <script>
        const ADMIN_SECRET_CODE = "ADMIN2026";

        // Load dark mode preference
        function initDarkMode() {
            if (localStorage.getItem('pref-darkMode') === '1') {
                document.body.classList.add('dark-mode');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark-mode');
            const isDarkMode = document.body.classList.contains('dark-mode');
            localStorage.setItem('pref-darkMode', isDarkMode ? '1' : '0');
        }

        function togglePasswordVisibility(e) {
            e = e || window.event;
            const input = document.getElementById('adminPassword');
            let btn = null;
            if (e.currentTarget && e.currentTarget.tagName) {
                btn = e.currentTarget;
            } else if (e.target) {
                btn = e.target.closest && e.target.closest('button');
            }
            const icon = (btn && btn.querySelector('i')) || document.querySelector('.toggle-btn i');

            if (!input || !icon) return;

            if (input.type === 'password') {
                input.type = 'text';
                icon.classList.remove('fa-eye');
                icon.classList.add('fa-eye-slash');
            } else {
                input.type = 'password';
                icon.classList.remove('fa-eye-slash');
                icon.classList.add('fa-eye');
            }
        }

        const BACKEND_BASE_URL = (() => {
            if (window.location.protocol === 'file:') return 'http://localhost:3000';
            if (window.location.hostname === 'localhost' && window.location.port === '3000') return window.location.origin;
            if (window.location.hostname === '127.0.0.1' && window.location.port === '3000') return window.location.origin;
            return 'http://localhost:3000';
        })();

        function getAdminToken() {
            return localStorage.getItem('adminToken');
        }

        function getAuthHeaders() {
            const token = getAdminToken();
            return {
                'Content-Type': 'application/json',
                ...(token ? { Authorization: `Bearer ${token}` } : {})
            };
        }

        function getLocalAdminAccounts() {
            try {
                return JSON.parse(localStorage.getItem('adminAccounts') || '[]');
            } catch (error) {
                return [];
            }
        }

        function initLocalModeBanner() {
            const banner = document.getElementById('localModeBanner');
            if (!banner) return;
            const accounts = getLocalAdminAccounts();
            if (accounts.length > 0) {
                banner.classList.remove('hidden');
                banner.querySelector('div').innerHTML = `<strong>Local sign in available:</strong> ${accounts.length} admin account${accounts.length > 1 ? 's' : ''} are stored locally and can log in if the backend is offline.`;
            } else {
                banner.classList.add('hidden');
            }
        }

        function findLocalAdminAccount(username) {
            const normalized = username.trim().toLowerCase();
            return getLocalAdminAccounts().find(acc => acc.username.toLowerCase() === normalized) || null;
        }

        function tryLocalAdminLogin(username, password) {
            const admin = findLocalAdminAccount(username);
            if (!admin) return null;
            if (admin.password !== password) return null;
            return {
                id: admin.id,
                username: admin.username,
                displayName: admin.displayName,
                role: admin.role || 'admin',
                accountType: 'admin'
            };
        }

        function isLocalAdminToken(token) {
            return Boolean(token && token.startsWith('local-admin-'));
        }

        function isLocalAdminUser() {
            try {
                const user = JSON.parse(localStorage.getItem('user') || '{}');
                return user && (user.role === 'admin' || user.role === 'superadmin' || user.accountType === 'admin');
            } catch (error) {
                return false;
            }
        }

        async function redirectIfAuthenticated() {
            const token = getAdminToken();
            if (!token) return;

            if (isLocalAdminToken(token) && isLocalAdminUser()) {
                window.location.href = '/admin-dashboard.html';
                return;
            }

            try {
                const response = await fetch(`${BACKEND_BASE_URL}/api/admin/me`, {
                    headers: getAuthHeaders()
                });

                if (!response.ok) {
                    // remove invalid token
                    if (response.status === 401 || response.status === 403) {
                        localStorage.removeItem('adminToken');
                        localStorage.removeItem('adminSession');
                        localStorage.removeItem('user');
                    }
                    return;
                }

                const payload = await response.json().catch(() => null);
                if (payload && payload.ok && payload.user && (payload.user.role === 'admin' || payload.user.role === 'superadmin')) {
                    window.location.href = '/admin-dashboard.html';
                } else {
                    // unexpected payload, clear token
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('adminSession');
                    localStorage.removeItem('user');
                }
            } catch (error) {
                console.warn('[Admin Login] Token check failed:', error);
            }
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            const successText = document.getElementById('successText');
            successText.textContent = message;
            successDiv.classList.add('show');

            setTimeout(() => {
                successDiv.classList.remove('show');
            }, 5000);
        }

        function clearMessages() {
            document.getElementById('errorMessage').classList.remove('show');
            document.getElementById('successMessage').classList.remove('show');
        }

        function showError(message) {
            clearMessages();
            const errorDiv = document.getElementById('errorMessage');
            const errorText = document.getElementById('errorText');
            errorText.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 5000);
        }

        async function adminLogin(event) {
            event.preventDefault();

            const adminId = document.getElementById('adminId').value.trim();
            const adminPassword = document.getElementById('adminPassword').value;
            const adminKey = document.getElementById('adminKey').value;

            if (!adminKey) {
                showError('Admin secret code is required.');
                return;
            }
            if (adminKey !== ADMIN_SECRET_CODE) {
                showError('Invalid admin secret code. Access denied.');
                console.warn('Failed admin login attempt: Invalid secret code');
                return;
            }

            try {
                const response = await fetch(`${BACKEND_BASE_URL}/api/admin/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username: adminId, password: adminPassword, secretCode: adminKey })
                });

                const result = await response.json();
                if (!response.ok) {
                    const localUser = tryLocalAdminLogin(adminId, adminPassword);
                    if (localUser) {
                        localStorage.setItem('user', JSON.stringify(localUser));
                        localStorage.setItem('adminToken', `local-admin-${Date.now()}`);
                        localStorage.setItem('adminSession', JSON.stringify({
                            userId: localUser.id || localUser.username,
                            token: localStorage.getItem('adminToken'),
                            loginTime: new Date().toISOString(),
                            verified: true
                        }));
                        window.location.href = '/admin-dashboard.html';
                        return;
                    }
                    showError(result.message || 'Login failed. Please check your credentials.');
                    return;
                }

                const user = result.user || {
                    id: adminId,
                    username: adminId,
                    role: 'admin',
                    accountType: 'admin'
                };
                const token = result.token || `local-admin-${Date.now()}`;

                localStorage.setItem('user', JSON.stringify(user));
                localStorage.setItem('adminToken', token);
                localStorage.setItem('adminSession', JSON.stringify({
                    userId: user.id || user.username,
                    token,
                    loginTime: new Date().toISOString(),
                    verified: true
                }));

                const validateResponse = await fetch(`${BACKEND_BASE_URL}/api/admin/me`, {
                    headers: {
                        'Content-Type': 'application/json',
                        'Authorization': `Bearer ${result.token}`
                    }
                });

                if (!validateResponse.ok) {
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('adminSession');
                    localStorage.removeItem('user');
                    showError('Unable to validate session token. Please try again.');
                    return;
                }

                const validated = await validateResponse.json();
                if (!validated.ok || !validated.user) {
                    localStorage.removeItem('adminToken');
                    localStorage.removeItem('adminSession');
                    localStorage.removeItem('user');
                    showError('Session validation failed. Please log in again.');
                    return;
                }

                window.location.href = '/admin-dashboard.html';
            } catch (error) {
                console.warn('Admin login backend failed, trying local admin login...', error);
                const localUser = tryLocalAdminLogin(adminId, adminPassword);
                if (localUser) {
                    localStorage.setItem('user', JSON.stringify(localUser));
                    localStorage.setItem('adminToken', `local-admin-${Date.now()}`);
                    localStorage.setItem('adminSession', JSON.stringify({
                        userId: localUser.id || localUser.username,
                        token: localStorage.getItem('adminToken'),
                        loginTime: new Date().toISOString(),
                        verified: true
                    }));
                    window.location.href = '/admin-dashboard.html';
                    return;
                }
                localStorage.removeItem('adminToken');
                localStorage.removeItem('adminSession');
                localStorage.removeItem('user');
                showError('Unable to reach the server. Please try again later.');
            }
        }

        // Initialize on page load
        function parseQueryParams() {
            const params = new URLSearchParams(window.location.search);
            return {
                registered: params.get('registered') === 'true',
                username: params.get('username') || ''
            };
        }

        document.addEventListener('DOMContentLoaded', () => {
            initDarkMode();
            initLocalModeBanner();
            redirectIfAuthenticated();

            const params = parseQueryParams();
            if (params.registered) {
                showSuccess('Registration successful. Please log in with your new account.');
            }
            if (params.username) {
                const userField = document.getElementById('adminId');
                if (userField) {
                    userField.value = params.username;
                    const passwordField = document.getElementById('adminPassword');
                    if (passwordField) {
                        passwordField.focus();
                    }
                }
            }

            const adminForm = document.getElementById('adminLoginForm');
            if (adminForm) {
                adminForm.addEventListener('submit', adminLogin);
            }
        });
    </script>
</body>
</html>
